name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.profile }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [default, native]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify default reactor
        if: matrix.profile == 'default'
        run: mvn -B -ntp clean verify
      - name: Verify native reactor
        if: matrix.profile == 'native'
        run: mvn -B -ntp clean verify -Pnative
      - name: Print native environment
        if: matrix.profile == 'native'
        env:
          JAVA_TOOL_OPTIONS: -Dvectorforge.native.library.dir=vectorforge-native/target/native-lib
        run: java -cp vectorforge-native/target/classes com.vectorforge.nativeindex.NativeEnvironmentReport
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.profile }}-${{ matrix.os }}
          path: "**/target/surefire-reports/*"
          if-no-files-found: ignore
